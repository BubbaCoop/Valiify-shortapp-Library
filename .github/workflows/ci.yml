name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    env:
      # Exposed at job level so the chromatic step's `if` can test it —
      # the `secrets` context is not valid in a step-level `if`.
      CHROMATIC_PROJECT_TOKEN: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Chromatic needs full git history to find baseline commits.
          fetch-depth: 0

      # Pinned to the version these gates are green on locally (931/931).
      # Bump deliberately, not by inheriting whatever the runner ships.
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
          cache: npm

      - run: npm ci

      # .claude/agents/*.md and .claude/commands/{val,extract}.md are GENERATED
      # by @valiify/val-core from its templates + val/config.json. This fails if
      # any of them is stale or hand-edited — including after a val-core
      # version bump, because the version is stamped into every header. Fix:
      # `npm run val:init`, review, commit.
      - name: val:check
        run: npm run val:check

      # Cheap gates first, so a typo fails in seconds rather than after the
      # 11MB Storybook build.
      - name: typecheck
        run: npm run typecheck

      - name: build
        run: npm run build

      # Chromium for every computed-style gate below (and verify:visual later).
      - name: playwright chromium
        run: npx playwright install --with-deps chromium

      # Reads dist, so it has to follow build. Guards the cascade-layer
      # statement that the whole consumer-override contract depends on.
      - name: verify:layers
        run: npm run verify:layers

      # Bundle integrity: undefined var() refs (the surface-frame bug class)
      # and component-class/utility collisions (the .list-item bug class).
      # Reads dist, so it follows build.
      - name: verify:bundle
        run: npm run verify:bundle

      - name: verify:markup
        run: npm run verify:markup

      # Computed styles inside a host — the class no manifest gate can see.
      # verify:layer-defeat  the 1.0.0 repro: an unlayered host `button { border: 0 }`
      #                      must not beat .va-dropdown-field-trigger.
      # verify:reset         src/reset.css may override nothing the bundle declares
      #                      on a documented element (1.0.0: 50 defeats).
      # verify:utility-precedence  no va: utility in generated markup loses to a
      #                      compound component selector (unlayered bundle contract).
      - name: verify:layer-defeat
        run: npm run verify:layer-defeat

      - name: verify:reset
        run: npm run verify:reset

      - name: verify:utility-precedence
        run: npm run verify:utility-precedence

      # The bundle inside the two host stacks it is shipped into: Tailwind 3 +
      # daisyUI 4 (element reset, three load paths) and SvelteKit (scoped styles).
      # Both passed 1.0.0 on the common path and failed it on the linked one.
      - name: examples — host checks
        run: |
          set -euo pipefail
          for ex in daisyui-starter sveltekit-starter; do
            echo "::group::examples/$ex"
            (cd "examples/$ex" && npm ci --no-audit --no-fund && npm run check)
            echo "::endgroup::"
          done

      # The packed tarball in a real consumer Vite build (both entry points).
      # Catches exports-map/files-whitelist breakage nothing else can see.
      - name: verify:package
        run: npm run verify:package

      - name: audit
        run: npm run audit

      # verify-component takes positional component names and has no --all
      # flag, so the loop is deliberate glue rather than a missing feature.
      # index.css and _template.css are not components.
      - name: verify:component (every component)
        run: |
          set -euo pipefail
          for f in src/components/*.css; do
            n=$(basename "$f" .css)
            case "$n" in index|_template) continue;; esac
            name=$(printf '%s' "$n" | awk -F- '{for (i=1;i<=NF;i++) printf toupper(substr($i,1,1)) substr($i,2)}')
            npm run --silent verify:component "$name"
          done

      # verify:visual drives a real browser and reads ${BASE_URL}/index.json —
      # it needs Storybook over HTTP. It has no file:// path, so a static build
      # alone is not enough; it must be served. Proven locally at 931/931
      # against the static output on port 6007.

      - name: build-storybook
        run: npm run build-storybook

      - name: Serve static Storybook
        run: npx --yes http-server storybook-static -p 6007 --silent &

      - name: Wait for Storybook
        run: npx --yes wait-on -t 60000 http://127.0.0.1:6007/index.json

      - name: verify:visual
        run: npm run verify:visual -- --url http://127.0.0.1:6007

      # axe over every story — reuses the Chromium install and the served
      # static Storybook from the steps above. Known design defects are
      # waived (and printed) via KNOWN_ISSUES in scripts/a11y-scan.mjs.
      - name: verify:a11y
        run: npm run verify:a11y -- --url http://127.0.0.1:6007

      # DECIDED 2026-10-15: the visual-spec harness (verify:visual, 741
      # Figma-extracted assertions) IS the visual regression gate; Chromatic
      # is CLOSED unless designer review ever needs screenshot diffs. This
      # step stays as inert plumbing — it runs only if someone sets the
      # CHROMATIC_PROJECT_TOKEN secret, which is the deliberate opt-in.
      - name: chromatic
        if: ${{ env.CHROMATIC_PROJECT_TOKEN != '' }}
        run: npx chromatic --storybook-build-dir storybook-static --exit-zero-on-changes

      # LAST on purpose. This gate reads prose, not the bundle, so nothing downstream
      # depends on it — and when it sat above verify:markup / verify:package /
      # verify:visual, a single stale class name in a doc failed the job before any of
      # them ran. A documentation finding must not mask a build finding.
      - name: verify:vocabulary
        run: npm run verify:vocabulary

      # Same slot and same reasoning as verify:vocabulary: reads shipped prose,
      # nothing downstream depends on it. Fails when a doc inside the tarball
      # links to a file that is not in the tarball, or to one that does not exist.
      - name: verify:doc-paths
        run: npm run verify:doc-paths

# Deliberately not here yet: `prettier --check`, which fails on 35 prose files
# (docs/*.md, CLAUDE.md, SKILL.md). Adding it now would ship CI red. Separate
# cleanup — see the audit's section 4.
